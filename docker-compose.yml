# One-command demo:  docker compose up --build
#   console  http://localhost:8501
#   api      http://localhost:8000/docs
#   tools    http://tools:8765/mcp       (Model Context Protocol, streamable HTTP; internal network only)
#   phoenix  http://localhost:6006       (traces)
# Live model: set FRAUD_MODEL_PROVIDER=cloudflare, CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in .env
# (without them the stack runs on the offline scripted model).
services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [{path: .env, required: false}]
    environment:
      FRAUD_TRACING: "1"
      FRAUD_OTLP_ENDPOINT: http://phoenix:6006/v1/traces
      FRAUD_TOOL_TRANSPORT: mcp
      FRAUD_MCP_URL: http://tools:8765/mcp
    command: ["uvicorn", "fraud_investigator.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes: [state:/app/data/runs, sessions:/app/data/sessions]
    depends_on: [tools, phoenix]

  tools:
    build: .
    # No published port: the tool server has no authentication, so only the api container can reach it.
    command: ["python", "-m", "fraud_investigator.mcp_server", "--http", "8765", "--host", "0.0.0.0"]
    expose: ["8765"]

  ui:
    build: .
    command: ["streamlit", "run", "ui/streamlit_app.py", "--server.address", "0.0.0.0", "--server.headless", "true"]
    environment:
      FRAUD_API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]

  phoenix:
    image: arizephoenix/phoenix:version-20.24.0
    ports: ["6006:6006"]

volumes:
  state: {}
  sessions: {}
