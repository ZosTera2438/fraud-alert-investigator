# Runtime settings. Variables in .env (git-ignored) are loaded first. Environment overrides:
#   FRAUD_MODEL_PROVIDER=scripted|gemini|ollama|replay
#   FRAUD_MODEL_ID=<model id for the chosen provider>
#   GEMINI_API_KEY=<key>   (or GOOGLE_API_KEY)
#   FRAUD_MODEL_FALLBACK=gemini|ollama|none
#   OLLAMA_HOST=http://localhost:11434

model:
  # scripted: deterministic offline policy used in tests and CI (no network).
  # replay:   replays model responses recorded from a live run (see evals/recordings).
  provider: scripted
  fallback: gemini          # used when the primary model is rate limited or down; null disables
  fallback_model_id: gemini-3.5-flash-lite
  gemini:
    model_id: gemini-3.5-flash
    temperature: 0.0
    max_output_tokens: 2048
  ollama:
    host: http://localhost:11434
    model_id: qwen3:8b
    temperature: 0.0
  aux_model:                # side calls such as the explanation judge
    provider: gemini
    model_id: gemini-3.5-flash-lite
  recordings_dir: evals/recordings

budgets:
  max_tool_calls: 12        # per alert, across both agents
  max_total_tokens: 60000   # per alert, across both agents

policy:
  approval_amount_threshold: 5000.0   # AUD; any decision above this needs an analyst
  max_policy_retries: 1               # one retry after a policy rejection, then escalate
  version: "v1"                       # part of the idempotency key

tools:
  transport: local          # local | mcp
  timeout_seconds: 5.0
  retry_attempts: 3
  max_text_chars: 2000      # longer free-text fields are truncated and flagged
  mcp_command: ["python", "-m", "fraud_investigator.mcp_server"]

paths:
  database: data/fraud.db
  sessions: data/sessions
  runs: data/runs

observability:
  enabled: false
  otlp_endpoint: http://localhost:6006/v1/traces
  service_name: fraud-alert-investigator

# Price per one million tokens, used for cost per alert (AUD). A model without an entry reports
# cost as unknown. Add gemini-3.5-* prices from https://ai.google.dev/gemini-api/docs/pricing.
pricing:
  gemini-2.5-flash: {input: 0.46, output: 3.85}
  gemini-2.5-flash-lite: {input: 0.15, output: 0.62}
  qwen3:8b: {input: 0.0, output: 0.0}
  llama3.1:8b: {input: 0.0, output: 0.0}
  scripted: {input: 0.0, output: 0.0}
