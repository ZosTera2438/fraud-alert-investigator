<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-labelledby="title desc">
  <title id="title">Fraud Alert Investigator deployment</title>
  <desc id="desc">Docker Compose runs four services on a private network: the Streamlit console, the FastAPI service with the Strands graph, the MCP tool server and Arize Phoenix. The API calls Cloudflare Workers AI for the live model; Gemini is used only for comparisons.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3C4043"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #202124; }
      .h1 { font-size: 22px; font-weight: 600; }
      .h { font-size: 14px; font-weight: 600; }
      .t { font-size: 12px; }
      .s { font-size: 11px; fill: #3C4043; }
      .agent { fill: #E8F0FE; stroke: #1A73E8; stroke-width: 1.5; }
      .code { fill: #E6F4EA; stroke: #188038; stroke-width: 1.5; }
      .tools { fill: #F3E8FD; stroke: #8430CE; stroke-width: 1.5; }
      .cross { fill: #F1F3F4; stroke: #5F6368; stroke-width: 1.5; }
      .input { fill: #FFFFFF; stroke: #3C4043; stroke-width: 1.5; }
      .human { fill: #FEF7E0; stroke: #E37400; stroke-width: 1.5; }
      .flow { stroke: #3C4043; stroke-width: 1.6; fill: none; }
      .dashed { stroke: #5F6368; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; }
      .zone { fill: #FAFAFA; stroke: #5F6368; stroke-width: 1.4; stroke-dasharray: 8 5; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="540" fill="#FFFFFF"/>
  <text x="40" y="40" class="h1">Fraud Alert Investigator: deployment (docker compose up --build)</text>
  <text x="40" y="64" class="t">Four containers on a private network. The same services also run as local processes; see the README.</text>

  <!-- Analyst -->
  <rect x="40" y="135" width="180" height="80" rx="8" class="human"/>
  <text x="130" y="165" text-anchor="middle" class="h">Analyst browser</text>
  <text x="130" y="187" text-anchor="middle" class="t">localhost:8501, :8000/docs,</text>
  <text x="130" y="203" text-anchor="middle" class="t">:6006 for traces</text>

  <!-- Compose network -->
  <rect x="260" y="95" width="720" height="370" rx="10" class="zone"/>
  <text x="280" y="118" class="h">docker compose network (private)</text>

  <!-- Console -->
  <rect x="290" y="135" width="200" height="80" rx="8" class="input"/>
  <text x="390" y="162" text-anchor="middle" class="h">ui: Streamlit console</text>
  <text x="390" y="184" text-anchor="middle" class="t">port 8501 published</text>
  <text x="390" y="200" text-anchor="middle" class="t">approve, evidence, audit</text>

  <!-- API -->
  <rect x="540" y="135" width="410" height="150" rx="8" class="agent"/>
  <text x="745" y="160" text-anchor="middle" class="h">api: FastAPI + Strands Graph (port 8000 published)</text>
  <text x="745" y="184" text-anchor="middle" class="t">Intake, investigator agent, scoring, decision agent, action</text>
  <text x="745" y="203" text-anchor="middle" class="t">Hooks: redaction, budget, scope, evidence, policy guard, approval</text>
  <text x="745" y="222" text-anchor="middle" class="t">Paused runs on volumes (FileSessionManager): survive restarts</text>
  <text x="745" y="241" text-anchor="middle" class="t">Idempotent case and card block, audit log (SQLite)</text>
  <text x="745" y="265" text-anchor="middle" class="s">FRAUD_TOOL_TRANSPORT=mcp   FRAUD_TRACING=1</text>

  <!-- Tools -->
  <rect x="540" y="335" width="410" height="100" rx="8" class="tools"/>
  <text x="745" y="360" text-anchor="middle" class="h">tools: MCP server, streamable HTTP (port 8765 not published)</text>
  <text x="745" y="384" text-anchor="middle" class="t">Five read-only tools, annotated read-only and idempotent</text>
  <text x="745" y="403" text-anchor="middle" class="t">SQLite with synthetic customers, merchants, devices</text>
  <text x="745" y="422" text-anchor="middle" class="s">No authentication, so only the api container can reach it</text>

  <!-- Phoenix -->
  <rect x="290" y="335" width="200" height="100" rx="8" class="cross"/>
  <text x="390" y="362" text-anchor="middle" class="h">phoenix: Arize Phoenix</text>
  <text x="390" y="384" text-anchor="middle" class="t">port 6006 published</text>
  <text x="390" y="403" text-anchor="middle" class="t">OTLP over HTTP</text>
  <text x="390" y="422" text-anchor="middle" class="t">one trace per alert</text>

  <!-- External models -->
  <rect x="1030" y="135" width="210" height="90" rx="8" class="input"/>
  <text x="1135" y="160" text-anchor="middle" class="h">Cloudflare Workers AI</text>
  <text x="1135" y="182" text-anchor="middle" class="t">DeepSeek V4.1 Flash (live)</text>
  <text x="1135" y="200" text-anchor="middle" class="t">fallback GLM-5.3 Flash</text>
  <text x="1135" y="216" text-anchor="middle" class="s">OpenAI-compatible endpoint</text>

  <rect x="1030" y="250" width="210" height="70" rx="8" class="input" stroke-dasharray="6 4"/>
  <text x="1135" y="276" text-anchor="middle" class="h">Google Gemini 3.7 Flash</text>
  <text x="1135" y="298" text-anchor="middle" class="t">model comparisons only</text>

  <rect x="1030" y="345" width="210" height="70" rx="8" class="code"/>
  <text x="1135" y="371" text-anchor="middle" class="h">Scripted model (offline)</text>
  <text x="1135" y="393" text-anchor="middle" class="t">default without credentials, CI</text>

  <!-- Flows -->
  <line x1="220" y1="175" x2="288" y2="175" class="flow" marker-end="url(#arrow)"/>
  <text x="254" y="166" text-anchor="middle" class="s">HTTP</text>
  <line x1="490" y1="175" x2="538" y2="175" class="flow" marker-end="url(#arrow)"/>
  <text x="514" y="166" text-anchor="middle" class="s">REST</text>
  <line x1="745" y1="285" x2="745" y2="333" class="flow" marker-end="url(#arrow)"/>
  <text x="755" y="313" class="s">MCP tool calls; results are untrusted data</text>
  <line x1="560" y1="285" x2="470" y2="333" class="flow" marker-end="url(#arrow)"/>
  <text x="462" y="303" text-anchor="end" class="s">OTLP spans</text>
  <line x1="950" y1="180" x2="1028" y2="180" class="flow" marker-end="url(#arrow)"/>
  <text x="989" y="171" text-anchor="middle" class="s">HTTPS</text>
  <line x1="950" y1="250" x2="1028" y2="285" class="dashed" marker-end="url(#arrow)"/>

  <text x="40" y="500" class="t">Published ports: 8501 (console), 8000 (API), 6006 (Phoenix). Credentials come from .env, which is git-ignored and excluded from the image by .dockerignore.</text>
  <text x="40" y="520" class="t">Without credentials the stack runs on the scripted model, so the demo works offline.</text>
</svg>
